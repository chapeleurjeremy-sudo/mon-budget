<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Mon Budget</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--blue:#2563eb;--green:#16a34a;--orange:#f59e0b;--red:#dc2626;--line:#e5eaf1;--shadow:0 8px 28px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:760px;margin:auto;padding-bottom:85px}.top{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:28px 20px 24px;border-radius:0 0 28px 28px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;opacity:.75}.content{padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.hero{text-align:center;padding:24px}.label{font-size:13px;color:var(--muted)}.big{font-size:43px;font-weight:800;margin:5px 0}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.status{font-weight:750}.small{font-size:12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:15px;padding:14px}.metric strong{display:block;font-size:20px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.category{padding:13px 0;border-bottom:1px solid var(--line)}.category:last-child{border-bottom:0}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--blue);border-radius:99px}button{border:0;border-radius:13px;padding:11px 14px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f7;color:var(--text)}.danger{background:#fee2e2;color:#b91c1c}.fab{position:fixed;right:18px;bottom:70px;width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;box-shadow:0 10px 30px rgba(37,99,235,.3)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px;z-index:5}.nav button{background:transparent;color:var(--muted)}.nav button.active{background:#eff6ff;color:var(--blue)}input,select{width:100%;padding:12px;border:1px solid #d7dee8;border-radius:12px;font-size:15px;background:#fff;color:var(--text)}label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.expense{padding:12px 0;border-bottom:1px solid var(--line)}.expense:last-child{border:0}.empty{text-align:center;padding:20px;color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#fff;width:100%;max-width:760px;border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow:auto}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:25px}.nav{position:static;border:0;background:transparent}}
</style></head><body><div class="app"><header class="top"><h1>Mon Budget</h1><p id="monthLabel"></p></header><main class="content">
<section id="dashboardView"><div class="card hero"><div class="label">Budget personnel restant</div><div class="big" id="remaining">0 €</div><div id="status" class="status"></div><div class="small muted" id="daily"></div></div><div class="grid"><div class="metric"><span class="label">Revenus</span><strong id="income">0 €</strong></div><div class="metric"><span class="label">Épargne prévue</span><strong id="saving">0 €</strong></div><div class="metric"><span class="label">Budget du mois</span><strong id="budget">0 €</strong></div><div class="metric"><span class="label">Dépensé</span><strong id="spent">0 €</strong></div></div><div class="card"><div class="row"><strong>Mes enveloppes</strong><button class="secondary" onclick="showView('settings')">Modifier</button></div><div id="envelopes"></div></div><div class="card"><div class="row"><strong>Dernières dépenses</strong><button class="secondary" onclick="showView('history')">Voir tout</button></div><div id="recent"></div></div></section>
<section id="historyView" class="hidden"><div class="card"><div class="row"><strong>Historique du mois</strong><strong id="historyTotal"></strong></div><div id="history"></div></div></section>
<section id="settingsView" class="hidden"><div class="card"><h2>Paramètres</h2><label>Revenu mensuel net</label><input id="incomeInput" type="number" min="0" step="10"><label>Objectif d'épargne mensuel</label><input id="savingInput" type="number" min="0" step="10"><div class="actions"><button class="primary" onclick="saveSettings()">Enregistrer</button><button class="secondary" onclick="resetData()">Réinitialiser</button></div></div><div class="card"><div class="row"><strong>Mes enveloppes</strong><button class="primary" onclick="addCategory()">+ Ajouter</button></div><div id="categorySettings"></div></div><div class="card"><strong>Sauvegarde</strong><p class="small muted">V1 : les données restent sur cet appareil. Tu peux exporter une sauvegarde JSON.</p><div class="actions"><button class="secondary" onclick="exportData()">Exporter</button><button class="secondary" onclick="document.getElementById('importFile').click()">Importer</button><input id="importFile" class="hidden" type="file" accept=".json" onchange="importData(event)"></div></div></section>
</main><button class="fab" onclick="openExpense()">+</button><nav class="nav"><button id="navDash" class="active" onclick="showView('dashboard')">🏠 Accueil</button><button id="navHist" onclick="showView('history')">📋 Dépenses</button><button id="navSet" onclick="showView('settings')">⚙️ Paramètres</button></nav></div>
<div id="modal" class="modal hidden"><div class="sheet"><h2>Ajouter une dépense</h2><label>Montant (€)</label><input id="expenseAmount" type="number" min="0.01" step="0.01" placeholder="Ex. 35"><label>Enveloppe</label><select id="expenseCategory"></select><label>Description</label><input id="expenseNote" placeholder="Ex. restaurant, essence..."><div class="actions"><button class="primary" onclick="addExpense()">Enregistrer</button><button class="secondary" onclick="closeModal()">Annuler</button></div></div></div>
<script>
const KEY='monBudgetV1';const mk=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const initial={income:0,saving:0,categories:[],months:{}};let data=JSON.parse(localStorage.getItem(KEY)||'null')||initial;if(!data.months)data.months={};if(!data.months[mk()])data.months[mk()]=[];function save(){localStorage.setItem(KEY,JSON.stringify(data))}function exps(){return data.months[mk()]||[]}function spent(id){return exps().filter(e=>e.category===id).reduce((a,e)=>a+e.amount,0)}function total(){return exps().reduce((a,e)=>a+e.amount,0)}function showView(v){['dashboard','history','settings'].forEach(x=>document.getElementById(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(v==='dashboard'?'navDash':v==='history'?'navHist':'navSet').classList.add('active');render()}
function render(){let d=new Date(),names=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];document.getElementById('monthLabel').textContent=names[d.getMonth()]+' '+d.getFullYear();let budget=Math.max(0,data.income-data.saving),s=total(),r=budget-s;document.getElementById('income').textContent=eur(data.income);document.getElementById('saving').textContent=eur(data.saving);document.getElementById('budget').textContent=eur(budget);document.getElementById('spent').textContent=eur(s);document.getElementById('remaining').textContent=eur(r);let days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),left=Math.max(1,days-d.getDate()+1),daily=r>0?r/left:0,st=document.getElementById('status');if(r<0){st.textContent='🔴 Budget dépassé';st.className='status red'}else if(daily<10){st.textContent='🟠 Attention au rythme de dépenses';st.className='status orange'}else{st.textContent='🟢 Tu es dans les clous';st.className='status green'}document.getElementById('daily').textContent=r>0?'≈ '+eur(daily)+' disponibles par jour jusqu’à la fin du mois':'Réduis les dépenses pour revenir dans le budget';document.getElementById('envelopes').innerHTML=data.categories.length?data.categories.map(c=>{let x=spent(c.id),rr=c.budget-x,p=Math.min(100,Math.max(0,x/c.budget*100||0));return `<div class="category"><div class="row"><span>${c.icon||'📦'} <strong>${esc(c.name)}</strong></span><strong class="${rr<0?'red':''}">${eur(rr)}</strong></div><div class="small muted">${eur(x)} / ${eur(c.budget)}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}).join(''):'<div class="empty">Ajoute tes premières enveloppes dans Paramètres.</div>';let recent=exps().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);document.getElementById('recent').innerHTML=recent.length?recent.map(ehtml).join(''):'<div class="empty">Aucune dépense enregistrée.</div>';document.getElementById('historyTotal').textContent=eur(s);document.getElementById('history').innerHTML=exps().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(ehtml).join('')||'<div class="empty">Aucune dépense.</div>';document.getElementById('incomeInput').value=data.income||'';document.getElementById('savingInput').value=data.saving||'';document.getElementById('categorySettings').innerHTML=data.categories.map((c,i)=>`<div class="category"><div class="row"><strong>${c.icon||'📦'} ${esc(c.name)}</strong><button class="danger" onclick="removeCat(${i})">Supprimer</button></div><div class="grid"><div><label>Nom</label><input value="${esc(c.name)}" onchange="editCat(${i},'name',this.value)"></div><div><label>Budget</label><input type="number" min="0" value="${c.budget}" onchange="editCat(${i},'budget',this.value)"></div></div></div>`).join('')}
function ehtml(e){let c=data.categories.find(x=>x.id===e.category);return `<div class="expense"><div class="row"><span><strong>${c?.icon||'📦'} ${esc(e.note||c?.name||'Dépense')}</strong><br><span class="small muted">${new Date(e.date).toLocaleDateString('fr-FR')}</span></span><strong>${eur(e.amount)}</strong></div></div>`}function openExpense(){document.getElementById('expenseCategory').innerHTML=data.categories.map(c=>`<option value="${c.id}">${c.icon||'📦'} ${esc(c.name)}</option>`).join('');if(!data.categories.length)return alert('Crée au moins une enveloppe dans Paramètres.');document.getElementById('expenseAmount').value='';document.getElementById('expenseNote').value='';document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function addExpense(){let a=Number(document.getElementById('expenseAmount').value);if(!a||a<=0)return alert('Indique un montant valide.');data.months[mk()].push({id:Date.now(),amount:a,category:document.getElementById('expenseCategory').value,note:document.getElementById('expenseNote').value.trim(),date:new Date().toISOString()});save();closeModal();render()}function saveSettings(){data.income=Number(document.getElementById('incomeInput').value)||0;data.saving=Number(document.getElementById('savingInput').value)||0;save();render();alert('Paramètres enregistrés.')}function editCat(i,k,v){data.categories[i][k]=k==='budget'?Number(v)||0:v;save();render()}function addCategory(){let n=prompt('Nom de l’enveloppe :');if(!n)return;let b=Number(prompt('Budget mensuel (€) :','0'))||0;data.categories.push({id:'c'+Date.now(),name:n,budget:b,icon:'📦'});save();render()}function removeCat(i){if(confirm('Supprimer cette enveloppe ?')){data.categories.splice(i,1);save();render()}}function resetData(){if(confirm('Réinitialiser complètement l’application ?')){localStorage.removeItem(KEY);location.reload()}}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mon-budget-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(typeof x.income!=='number'||!Array.isArray(x.categories))throw 0;data=x;if(!data.months)data.months={};if(!data.months[mk()])data.months[mk()]=[];save();render();alert('Import réussi.')}catch(e){alert('Fichier invalide.')}};r.readAsText(f)}render();
</script></body></html>

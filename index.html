<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>Mon Budget V1.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f6fb;color:#172033}.app{max-width:760px;margin:auto;padding-bottom:75px}header{background:#2563eb;color:white;padding:20px 16px;position:sticky;top:0;z-index:5}header h1{margin:0}header p{margin:4px 0;font-size:13px}main{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.env{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #17203312}.stat small,.muted{color:#667085}.stat strong{display:block;font-size:21px;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}.section h2,.section h3{margin:0}.btn{border:0;border-radius:10px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:700}.secondary{background:#e9eef7;color:#24324a}.danger{background:#dc3545}.small{padding:7px 9px;font-size:12px}.envelopes{display:grid;gap:10px}.env{cursor:pointer;margin:0}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row{padding:11px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.progress{height:8px;background:#e8edf5;border-radius:9px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#2563eb}.badge{padding:3px 7px;border-radius:99px;background:#eaf2ff;color:#2563eb;font-size:11px}.off{background:#eee;color:#777}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}.nav button{flex:1;border:0;background:#fff;color:#667085;padding:8px;font-size:11px}.nav button.active{color:#2563eb;font-weight:700}.nav span{display:block;font-size:18px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#f7f9fc;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;max-width:760px;margin:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.empty{text-align:center;padding:24px;color:#667085}.kpi{background:#eff6ff;border-radius:12px;padding:12px;margin:10px 0}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #d8deea;border-radius:10px;background:white}form .actions{margin-top:15px}@media(min-width:650px){.envelopes{grid-template-columns:1fr 1fr}.modal{align-items:center}.sheet{border-radius:22px;max-width:620px}}
</style></head><body><div class="app"><header><h1>Mon Budget</h1><p id="month"></p></header><main id="content"></main></div>
<nav class="nav"><button data-p="home" onclick="page('home')"><span>🏠</span>Accueil</button><button data-p="expenses" onclick="page('expenses')"><span>🧾</span>Achats</button><button data-p="recurring" onclick="page('recurring')"><span>🔄</span>Récurrents</button><button data-p="settings" onclick="page('settings')"><span>⚙️</span>Réglages</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="monBudgetV1_2",OLD="monBudgetV1_1";let d={income:2550,saving:300,envelopes:[["Compte commun",1400],["Essence",240],["Restaurants",100],["Sport & plaisir",200],["Fille",100],["Vêtements",50],["Coiffeur",40],["Téléphone",21],["Mutuelle",20]].map((x,i)=>({id:"e"+i,name:x[0],budget:x[1]})),expenses:[],recurring:[],cancelledRecurring:[]};
const id=()=>Math.random().toString(36).slice(2,9),month=()=>{let x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")},today=()=>new Date().toISOString().slice(0,10),eur=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}),esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x])),env=x=>d.envelopes.find(e=>e.id===x),save=()=>localStorage.setItem(KEY,JSON.stringify(d));
function load(){let r=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(r)try{d={...d,...JSON.parse(r)}}catch(e){}d.recurring=Array.isArray(d.recurring)?d.recurring:[];d.cancelledRecurring=Array.isArray(d.cancelledRecurring)?d.cancelledRecurring:[];d.expenses=Array.isArray(d.expenses)?d.expenses:[];save();gen()}
function gen(){let m=month(),z=m.split("-").map(Number),last=new Date(z[0],z[1],0).getDate();d.recurring.forEach(r=>{if(!r.active||d.cancelledRecurring.some(x=>x.recurringId===r.id&&x.month===m)||d.expenses.some(x=>x.recurringId===r.id&&x.recurringMonth===m))return;let day=Math.min(Math.max(1,+r.day||1),last);d.expenses.push({id:id(),amount:+r.amount,envelopeId:r.envelopeId,description:r.name,date:m+"-"+String(day).padStart(2,"0"),recurringId:r.id,recurringMonth:m})});save()}
const ex=()=>d.expenses.filter(x=>x.date?.slice(0,7)===month()),spent=e=>ex().filter(x=>x.envelopeId===e).reduce((a,x)=>a+ +x.amount,0),rt=()=>d.recurring.filter(x=>x.active).reduce((a,x)=>a+ +x.amount,0);
function page(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));({home,expenses,recurring,settings}[p])()}
function home(){let total=ex().reduce((a,x)=>a+ +x.amount,0),rest=d.income-d.saving-total;content.innerHTML=`<div class="grid"><div class="card stat"><small>Revenus</small><strong>${eur(d.income)}</strong></div><div class="card stat"><small>Épargne cible</small><strong>${eur(d.saving)}</strong></div><div class="card stat"><small>Engagé ce mois</small><strong>${eur(total)}</strong></div><div class="card stat"><small>Reste</small><strong>${eur(rest)}</strong></div></div><div class="card"><div class="section"><h2>🔄 Récurrents</h2><b>${eur(rt())}/mois</b></div><div class="muted">${d.recurring.filter(x=>x.active).length} actif(s)</div></div><div class="section"><h2>Mes enveloppes</h2><button class="btn small" onclick="envForm()">+ Enveloppe</button></div><div class="envelopes">${d.envelopes.map(e=>{let s=spent(e.id),p=e.budget?Math.min(100,s/e.budget*100):0;return `<div class="env" onclick="detail('${e.id}')"><div class="top"><div><b>${esc(e.name)}</b><div class="muted">${eur(s)} / ${eur(e.budget)}</div></div><b>${eur(e.budget-s)}</b></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join("")}</div>`}
function expenses(){let a=ex().sort((x,y)=>y.date.localeCompare(x.date));content.innerHTML=`<div class="section"><h2>Achats du mois</h2><button class="btn small" onclick="expenseForm()">+ Achat</button></div><div class="card">${a.length?a.map(x=>`<div class="row"><div><b>${x.recurringId?"🔄 ":""}${esc(x.description)}</b><div class="muted">${x.date} · ${esc(env(x.envelopeId)?.name||"")}</div></div><div class="actions"><b>${eur(x.amount)}</b><button class="btn secondary small" onclick="expenseForm('${x.id}')">✏️</button><button class="btn danger small" onclick="delExpense('${x.id}')">🗑️</button></div></div>`).join(""):"<div class='empty'>Aucun achat ce mois-ci.</div>"}</div>`}
function recurring(){content.innerHTML=`<div class="card"><div class="section"><h2>Paiements récurrents</h2><b>${eur(rt())}/mois</b></div><div class="muted">Chaque paiement actif est ajouté une seule fois par mois.</div></div><div class="section"><h2>Mes récurrents</h2><button class="btn small" onclick="recForm()">+ Récurrent</button></div><div class="card">${d.recurring.length?d.recurring.map(r=>`<div class="row"><div><b>🔄 ${esc(r.name)}</b><div class="muted">${eur(r.amount)} · le ${r.day} · ${esc(env(r.envelopeId)?.name||"")}</div></div><div class="actions"><span class="badge ${r.active?"":"off"}">${r.active?"Actif":"Inactif"}</span><button class="btn secondary small" onclick="recForm('${r.id}')">✏️</button><button class="btn secondary small" onclick="toggle('${r.id}')">${r.active?"⏸":"▶️"}</button><button class="btn danger small" onclick="delRec('${r.id}')">🗑️</button></div></div>`).join(""):"<div class='empty'>Aucun paiement récurrent.</div>"}</div>`}
function settings(){content.innerHTML=`<div class="section"><h2>Réglages</h2></div><div class="card"><h3>Budget mensuel</h3><form onsubmit="settingsSave(event)"><label>Revenus nets mensuels</label><input id="income" type="number" step=".01" value="${d.income}"><label>Objectif d'épargne</label><input id="saving" type="number" step=".01" value="${d.saving}"><div class="actions"><button class="btn">Enregistrer</button></div></form></div><div class="card"><h3>Données</h3><div class="actions"><button class="btn secondary" onclick="exportData()">Exporter JSON</button><button class="btn secondary" onclick="imp.click()">Importer JSON</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="actions"><button class="btn danger" onclick="reset()">Réinitialiser</button></div></div>`}
function modal(h){sheet.innerHTML=h;document.getElementById("modal").classList.add("open")}function close(){document.getElementById("modal").classList.remove("open")}modal.onclick=e=>{if(e.target.id==="modal")close()};function opts(s){return d.envelopes.map(e=>`<option value="${e.id}" ${e.id===s?"selected":""}>${esc(e.name)}</option>`).join("")}
function expenseForm(i){let x=i&&d.expenses.find(a=>a.id===i);modal(`<button class="close" onclick="close()">×</button><h2>${x?"Modifier":"Nouvel"} achat</h2><form onsubmit="saveExpense(event,'${i||""}')"><label>Montant</label><input id="a" type="number" step=".01" required value="${x?.amount??""}"><label>Description</label><input id="desc" required value="${esc(x?.description||"")}"><label>Enveloppe</label><select id="en">${opts(x?.envelopeId||d.envelopes[0]?.id)}</select><label>Date</label><input id="dt" type="date" required value="${x?.date||today()}"><div class="actions"><button class="btn">Enregistrer</button></div></form>`)}
function saveExpense(e,i){e.preventDefault();let o={id:i||id(),amount:+a.value,description:desc.value,envelopeId:en.value,date:dt.value};if(i)d.expenses[d.expenses.findIndex(x=>x.id===i)]={...d.expenses.find(x=>x.id===i),...o};else d.expenses.push(o);save();close();page("expenses")}
function delExpense(i){if(!confirm("Supprimer cet achat ?"))return;let x=d.expenses.find(a=>a.id===i);if(x?.recurringId)d.cancelledRecurring.push({recurringId:x.recurringId,month:x.recurringMonth||x.date.slice(0,7)});d.expenses=d.expenses.filter(x=>x.id!==i);save();page("expenses")}
function recForm(i){let r=i&&d.recurring.find(x=>x.id===i);modal(`<button class="close" onclick="close()">×</button><h2>${r?"Modifier":"Nouveau"} paiement récurrent</h2><form onsubmit="saveRec(event,'${i||""}')"><label>Nom</label><input id="rn" required value="${esc(r?.name||"")}"><label>Montant</label><input id="ra" type="number" step=".01" required value="${r?.amount??""}"><label>Enveloppe</label><select id="re">${opts(r?.envelopeId||d.envelopes[0]?.id)}</select><label>Jour du mois</label><input id="rd" type="number" min="1" max="31" required value="${r?.day??1}"><label><input id="rac" type="checkbox" style="width:auto" ${r?.active!==false?"checked":""}> Actif</label><div class="actions"><button class="btn">Enregistrer</button></div></form>`)}
function saveRec(e,i){e.preventDefault();let o={id:i||id(),name:rn.value,amount:+ra.value,envelopeId:re.value,day:Math.min(31,Math.max(1,+rd.value)),active:rac.checked};if(i)d.recurring[d.recurring.findIndex(x=>x.id===i)]={...d.recurring.find(x=>x.id===i),...o};else d.recurring.push(o);save();gen();close();page("recurring")}
function toggle(i){let r=d.recurring.find(x=>x.id===i);r.active=!r.active;save();page("recurring")}function delRec(i){if(confirm("Supprimer ce paiement récurrent ?")){d.recurring=d.recurring.filter(x=>x.id!==i);save();page("recurring")}}
function detail(i){let e=env(i),a=ex().filter(x=>x.envelopeId===i),s=a.reduce((q,x)=>q+ +x.amount,0);modal(`<button class="close" onclick="close()">×</button><h2>${esc(e.name)}</h2><div class="kpi"><b>Budget :</b> ${eur(e.budget)}<br><b>Engagé :</b> ${eur(s)}<br><b>Reste :</b> ${eur(e.budget-s)}</div>${a.length?a.map(x=>`<div class="row"><span>${x.recurringId?"🔄 ":""}${esc(x.description)}<small class="muted">${x.date}</small></span><b>${eur(x.amount)}</b></div>`).join(""):"<div class='empty'>Aucun achat.</div>"}<div class="actions"><button class="btn secondary" onclick="close();envForm('${i}')">Modifier l'enveloppe</button></div>`)}
function envForm(i){let e=i&&env(i);modal(`<button class="close" onclick="close()">×</button><h2>${e?"Modifier":"Nouvelle"} enveloppe</h2><form onsubmit="saveEnv(event,'${i||""}')"><label>Nom</label><input id="enam" required value="${esc(e?.name||"")}"><label>Budget mensuel</label><input id="ebu" type="number" step=".01" required value="${e?.budget??""}"><div class="actions"><button class="btn">Enregistrer</button></div></form>`)}
function saveEnv(e,i){e.preventDefault();let o={id:i||id(),name:enam.value,budget:+ebu.value};if(i)d.envelopes[d.envelopes.findIndex(x=>x.id===i)]=o;else d.envelopes.push(o);save();close();page("home")}
function settingsSave(e){e.preventDefault();d.income=+income.value;d.saving=+saving.value;save();page("settings")}
function exportData(){let b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mon-budget-export.json";a.click()}
function importData(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{d={...d,...JSON.parse(r.result)};save();gen();page("home");alert("Import réussi.")}catch(x){alert("JSON invalide.")}};r.readAsText(f)}
function reset(){if(confirm("Réinitialiser toutes les données ?")){localStorage.removeItem(KEY);location.reload()}}
document.getElementById("month").textContent=new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});load();page("home");
</script></body></html>
